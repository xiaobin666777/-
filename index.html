<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium App Store</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-orange: #FF9500;
            --accent-color: #0A84FF;
        }

        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: -apple-system, "SF Pro Display", sans-serif;
            overflow-x: hidden;
            color: #fff;
        }

        .fluid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, #00416A, #1a2a6c, #007AFF);
            background-size: 400% 400%;
            animation: fluidMove 15s ease infinite;
            opacity: 0.6;
        }

        @keyframes fluidMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 50px 20px;
            box-sizing: border-box;
        }

        header h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin: 0;
            background: linear-gradient(to bottom, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 15px;
            color: rgba(255,255,255,0.6);
            margin-top: 6px;
            margin-bottom: 30px;
        }

        /* 标签全局样式 */
        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 6px;
        }
        .badge-tutorial { background: var(--ios-orange); color: #000; }
        .badge-app { background: var(--ios-blue); color: #fff; }
        .badge-shop { background: var(--ios-green); color: #fff; }

        /* 教程按钮区域 */
        .tutorial-box {
            background: rgba(255, 149, 0, 0.15);
            border: 1px solid rgba(255, 149, 0, 0.3);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        .tutorial-info h3 { margin: 0; font-size: 16px; font-weight: 600; color: #fff; }
        .tutorial-info p { margin: 4px 0 0; font-size: 13px; color: rgba(255,255,255,0.6); }
        
        .tutorial-btn {
            background: var(--ios-orange);
            color: #000;
            border: none;
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.2s;
        }
        .tutorial-btn:active { transform: scale(0.95); }

        /* 卡片样式 */
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .card-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-meta { display: flex; align-items: center; }
        .app-icon { width: 64px; height: 64px; border-radius: 16px; margin-right: 14px; display: flex; justify-content: center; align-items: center; font-size: 32px; }
        .plane-bg { background: linear-gradient(135deg, #2AABEE, #229ED9); }
        .vpn-bg { background: linear-gradient(135deg, #34C759, #11998e); }
        
        .app-details h2 { margin: 0; font-size: 20px; font-weight: 700; }
        .app-details p { margin: 4px 0 0; font-size: 13px; color: rgba(255,255,255,0.5); }

        /* 下载按钮 */
        .download-btn {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .download-btn:hover, .download-btn:active {
            background: #fff;
            color: #000;
        }

        /* 独立卡网/购买按钮 */
        .shop-link-box {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .shop-btn {
            background: rgba(52, 199, 89, 0.15);
            border: 1px solid rgba(52, 199, 89, 0.4);
            color: #34C759;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .shop-btn:active {
            background: rgba(52, 199, 89, 0.3);
        }

        /* 弹窗样式不变 */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: none; justify-content: center; align-items: center; z-index: 10000;
        }

        .popup-content { 
            position: relative; 
            width: 85%;
            max-width: 340px;
            background: #1c1c1e; 
            border-radius: 24px; 
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .close-btn { 
            position: absolute; 
            top: 8px; 
            right: 14px; 
            color: #fff; 
            font-size: 26px; 
            cursor: pointer; 
            z-index: 10001; 
            opacity: 0.7;
        }

        video { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>

<div class="fluid-bg"></div>

<div class="container">
    <header>
        <h1>应用中心</h1>
        <p>Premium Collection</p>
    </header>

    <!-- 教程区域：独立显眼，带有专属橙色标签 -->
    <div class="tutorial-box">
        <div class="tutorial-info">
            <span class="badge badge-tutorial">新手必看</span>
            <h3>使用与配置教程</h3>
            <p>首次安装请先查看此视频</p>
        </div>
        <button class="tutorial-btn" onclick="openVideo()">
            <span>🎬</span>播放
        </button>
    </div>

    <!-- 软件卡片 1 -->
    <div class="glass-card">
        <div class="card-main">
            <div class="app-meta">
                <div class="app-icon plane-bg">✈️</div>
                <div class="app-details">
                    <span class="badge badge-app">官方安装包</span>
                    <h2>Telegram</h2>
                    <p>极致安全的自由通讯</p>
                </div>
            </div>
            <!-- 下载动作按钮 -->
            <a href="https://pan.xunlei.com/s/VOtNTceK05Lf0q_HEpwGBghZA1" class="download-btn">下载</a>
        </div>
        
        <!-- 独立的卡网/购买区域 -->
        <div class="shop-link-box">
            <a href="https://new.818fka.com/shop/KKH011OA" class="shop-btn">
                <span>🛒</span> 没有纸飞机账号？点击此处购买/注册
            </a>
        </div>
    </div>

    <!-- 软件卡片 2 -->
    <div class="glass-card">
        <div class="card-main">
            <div class="app-meta">
                <div class="app-icon vpn-bg">🍵</div>
                <div class="app-details">
                    <span class="badge badge-app">网络优化</span>
                    <h2>绿茶 VPN</h2>
                    <p>跨越边界，丝滑连接</p>
                </div>
            </div>
            <!-- 下载/前往动作按钮 -->
            <a href="https://9.lcvpn.sbs/?id=505291048" class="download-btn">去获取</a>
        </div>
    </div>
</div>

<!-- 视频弹窗 -->
<div id="video-popup" class="popup-overlay" onclick="closeVideo()">
    <div class="popup-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeVideo()">×</span>
        <video id="player" controls>
            <source src="https://help.tgqqq.com/api.mp4" type="video/mp4">
        </video>
    </div>
</div>

<script>
    function openVideo() {
        document.getElementById('video-popup').style.display = 'flex';
        document.getElementById('player').play();
    }
    function closeVideo() {
        document.getElementById('video-popup').style.display = 'none';
        const v = document.getElementById('player');
        v.pause();
        v.currentTime = 0;
    }
</script>

</body>
</html>
