<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>应用中心 · 霓虹</title>
    <!-- Font Awesome 6 (免费图标库) - 用于 TG / QQ 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局重置 & 变量 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #111127;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-glow: rgba(139, 92, 246, 0.25);
            --text-primary: #f0f0ff;
            --text-secondary: #a8a8c8;
            --neon-purple: #8B5CF6;
            --neon-blue: #3B82F6;
            --neon-pink: #EC4899;
            --neon-cyan: #06B6D4;
            --neon-green: #34D399;
            --neon-orange: #FB923C;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --shadow-glow: 0 0 40px rgba(139, 92, 246, 0.15);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --transition: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            --font: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        }

        /* ===== 轻色模式（炫酷浅色） ===== */
        body.light-mode {
            --bg-primary: #f0f0f5;
            --bg-secondary: #e4e4ed;
            --bg-card: rgba(255, 255, 255, 0.6);
            --border-glow: rgba(139, 92, 246, 0.2);
            --text-primary: #1a1a2e;
            --text-secondary: #5a5a7a;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.3);
            --shadow-glow: 0 0 40px rgba(139, 92, 246, 0.08);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.6s ease, color 0.4s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 粒子画布 ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== 动态霓虹光晕背景 ===== */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-glow .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            animation: orbFloat 20s ease-in-out infinite alternate;
        }
        .bg-glow .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -10%;
            left: -10%;
            background: var(--neon-purple);
            animation-duration: 25s;
            animation-delay: 0s;
        }
        .bg-glow .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -10%;
            right: -10%;
            background: var(--neon-blue);
            animation-duration: 30s;
            animation-delay: 3s;
        }
        .bg-glow .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            top: 40%;
            left: 50%;
            background: var(--neon-pink);
            animation-duration: 22s;
            animation-delay: 6s;
            opacity: 0.15;
        }
        body.light-mode .bg-glow .orb {
            opacity: 0.12;
        }
        body.light-mode .bg-glow .orb:nth-child(1) {
            opacity: 0.08;
        }
        body.light-mode .bg-glow .orb:nth-child(2) {
            opacity: 0.08;
        }
        body.light-mode .bg-glow .orb:nth-child(3) {
            opacity: 0.06;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            33% {
                transform: translate(60px, -40px) scale(1.1) rotate(120deg);
            }
            66% {
                transform: translate(-30px, 50px) scale(0.9) rotate(240deg);
            }
            100% {
                transform: translate(20px, -20px) scale(1.05) rotate(360deg);
            }
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--neon-purple);
        }

        /* ===== 容器 ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 440px;
            margin: 0 auto;
            padding: 50px 18px 30px;
        }

        /* ===== 头部 ===== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding: 0 4px;
        }
        header h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.2));
        }
        body.light-mode header h1 {
            filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.1));
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== 主题切换按钮 ===== */
        .theme-toggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1.5px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all var(--transition);
            box-shadow: var(--shadow-glow);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            position: relative;
        }
        .theme-toggle:active {
            transform: scale(0.88);
        }
        .theme-toggle .icon-moon,
        .theme-toggle .icon-sun {
            position: absolute;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            line-height: 1;
        }
        .theme-toggle .icon-moon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }
        .theme-toggle .icon-sun {
            opacity: 0;
            transform: rotate(90deg) scale(0.5);
        }
        body.light-mode .theme-toggle .icon-moon {
            opacity: 0;
            transform: rotate(-90deg) scale(0.5);
        }
        body.light-mode .theme-toggle .icon-sun {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }
        .theme-toggle:hover {
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.3), var(--shadow-glow);
            border-color: var(--neon-purple);
        }

        /* ===== 欢迎横幅 ===== */
        .welcome-banner {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 440px;
            z-index: 9998;
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: var(--shadow-glow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.4s ease, border-color 0.4s ease;
            pointer-events: auto;
        }
        .welcome-banner.show {
            top: 16px;
        }
        .welcome-banner .welcome-text {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            min-width: 0;
        }
        .welcome-banner .welcome-text .emoji {
            font-size: 22px;
            flex-shrink: 0;
            animation: pulseEmoji 2s ease-in-out infinite;
        }
        @keyframes pulseEmoji {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }
        .welcome-banner .welcome-text .location {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
        .welcome-banner .welcome-close {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            line-height: 1;
        }
        .welcome-banner .welcome-close:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.9);
        }
        .welcome-banner .welcome-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== 卡片 ===== */
        .glass-card {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 18px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-glow), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: all var(--transition);
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(139, 92, 246, 0.03), transparent 60%);
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        .glass-card:hover {
            border-color: rgba(139, 92, 246, 0.2);
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.08), var(--shadow-glow);
            transform: translateY(-2px);
        }
        body.light-mode .glass-card:hover {
            border-color: rgba(139, 92, 246, 0.15);
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.06), var(--shadow-glow);
        }

        /* ===== Badge ===== */
        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            border: 1px solid transparent;
        }
        .badge-tutorial {
            background: rgba(251, 146, 60, 0.15);
            color: var(--neon-orange);
            border-color: rgba(251, 146, 60, 0.2);
        }
        .badge-app {
            background: rgba(139, 92, 246, 0.12);
            color: var(--neon-purple);
            border-color: rgba(139, 92, 246, 0.15);
        }

        /* ===== 教程区域 ===== */
        .tutorial-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .tutorial-info h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            transition: color 0.4s ease;
        }
        .tutorial-info p {
            margin: 4px 0 0;
            font-size: 12px;
            color: var(--text-secondary);
            transition: color 0.4s ease;
        }
        .tutorial-btn {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            color: #fff;
            border: none;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
            transition: all var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .tutorial-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .tutorial-btn:hover::after {
            opacity: 1;
        }
        .tutorial-btn:active {
            transform: scale(0.94);
        }
        .tutorial-btn:hover {
            box-shadow: 0 4px 30px rgba(139, 92, 246, 0.5);
            transform: translateY(-1px);
        }

        /* ===== 商店专区 ===== */
        .shop-section-title {
            font-size: 17px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 14px;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .shop-section-title .emoji {
            font-size: 22px;
        }
        .shop-grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .shop-card-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 12px;
            border-radius: var(--radius-md);
            text-decoration: none;
            text-align: center;
            transition: all var(--transition);
            border: 1px solid transparent;
            min-height: 96px;
            position: relative;
            overflow: hidden;
        }
        .shop-card-link::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.2;
            transition: opacity 0.4s ease;
        }
        .shop-card-link:hover::before {
            opacity: 0.6;
        }
        .shop-card-link:active {
            transform: scale(0.95);
        }

        .shop-card-primary {
            background: rgba(52, 211, 153, 0.06);
            border-color: rgba(52, 211, 153, 0.15);
            color: var(--neon-green);
        }
        .shop-card-primary .card-title {
            color: var(--neon-green);
        }
        .shop-card-primary:hover {
            border-color: rgba(52, 211, 153, 0.3);
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.08);
        }

        .shop-card-secondary {
            background: rgba(59, 130, 246, 0.06);
            border-color: rgba(59, 130, 246, 0.15);
            color: var(--neon-blue);
        }
        .shop-card-secondary .card-title {
            color: var(--neon-blue);
        }
        .shop-card-secondary:hover {
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.08);
        }

        .shop-card-link .card-icon {
            font-size: 30px;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.1));
        }
        .shop-card-link .card-title {
            font-size: 15px;
            font-weight: 700;
            transition: color 0.4s ease;
        }
        .shop-card-link .card-desc {
            font-size: 11px;
            opacity: 0.6;
            transition: color 0.4s ease;
        }

        /* ===== 应用列表 ===== */
        .app-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 0;
        }
        .app-separator {
            height: 1px;
            background: var(--glass-border);
            margin: 16px 0;
            transition: background 0.4s ease;
        }
        .app-meta {
            display: flex;
            align-items: center;
            min-width: 0;
        }
        .app-icon-img {
            width: 58px;
            height: 58px;
            border-radius: var(--radius-sm);
            margin-right: 14px;
            object-fit: cover;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: all var(--transition);
            flex-shrink: 0;
        }
        .app-icon-img:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 30px rgba(139, 92, 246, 0.15), 0 0 0 1px rgba(139, 92, 246, 0.1);
        }
        .app-details {
            min-width: 0;
        }
        .app-details h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
            transition: color 0.4s ease;
        }
        .app-details p {
            margin: 2px 0 0;
            font-size: 12px;
            color: var(--text-secondary);
            transition: color 0.4s ease;
        }
        .download-btn {
            background: rgba(139, 92, 246, 0.1);
            color: var(--neon-purple);
            border: 1px solid rgba(139, 92, 246, 0.15);
            padding: 7px 18px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: all var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .download-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            opacity: 0;
            transition: opacity 0.4s ease;
            border-radius: inherit;
        }
        .download-btn:hover::after {
            opacity: 1;
        }
        .download-btn:hover {
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.25);
            transform: translateY(-1px);
        }
        .download-btn:active {
            transform: scale(0.94);
        }
        .download-btn span {
            position: relative;
            z-index: 1;
        }

        /* ===== 弹窗 ===== */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .popup-content {
            position: relative;
            width: 90%;
            max-width: 380px;
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4), 0 0 0 1px var(--glass-border);
            border: 1px solid var(--glass-border);
            transform: scale(0.9);
            animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes popUp {
            to {
                transform: scale(1);
            }
        }
        .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            color: var(--text-secondary);
            font-size: 22px;
            cursor: pointer;
            z-index: 10001;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: none;
            line-height: 1;
        }
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: rotate(90deg);
        }
        .close-btn:active {
            transform: rotate(90deg) scale(0.9);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }

        /* ===== 提示弹窗 ===== */
        #notice-popup .popup-content {
            max-width: 400px;
            padding: 0;
            overflow: visible;
        }
        .notice-inner {
            padding: 28px 24px 24px;
        }
        .notice-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .notice-header .notice-icon {
            font-size: 32px;
            flex-shrink: 0;
            animation: pulseEmoji 2s ease-in-out infinite;
        }
        .notice-header .notice-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .notice-body {
            color: var(--text-primary);
        }
        .notice-body ol {
            margin: 0 0 12px 0;
            padding-left: 22px;
            font-size: 14px;
            line-height: 1.8;
            font-weight: 500;
            color: var(--text-primary);
        }
        .notice-body ol li::marker {
            color: var(--neon-purple);
            font-weight: 700;
        }
        .notice-extra {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 8px 0 12px 0;
            padding: 10px 14px;
            background: rgba(251, 146, 60, 0.08);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--neon-orange);
        }

    <script>
        // ============================================================
        //  1. 粒子系统
        // ============================================================
        (function initParticles() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;
            let particles = [];
            const COUNT = 70;
            let animId = null;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.size = Math.random() * 2.5 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.4;
                    this.speedY = (Math.random() - 0.5) * 0.4;
                    this.opacity = Math.random() * 0.5 + 0.2;
                    this.pulse = Math.random() * Math.PI * 2;
                    this.pulseSpeed = 0.01 + Math.random() * 0.02;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.pulse += this.pulseSpeed;
                    if (this.x < 0 || this.x > w) this.speedX *= -1;
                    if (this.y < 0 || this.y > h) this.speedY *= -1;
                }
                draw() {
                    const alpha = this.opacity * (0.7 + 0.3 * Math.sin(this.pulse));
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
                    gradient.addColorStop(0, `rgba(139, 92, 246, ${alpha})`);
                    gradient.addColorStop(0.5, `rgba(59, 130, 246, ${alpha * 0.6})`);
                    gradient.addColorStop(1, `rgba(139, 92, 246, 0)`);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                }
            }

            for (let i = 0; i < COUNT; i++) particles.push(new Particle());

            function drawLines() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            const alpha = 0.08 * (1 - dist / 120);
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(139, 92, 246, ${alpha})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, w, h);
                for (const p of particles) {
                    p.update();
                    p.draw();
                }
                drawLines();
                animId = requestAnimationFrame(animate);
            }
            animate();

            window.addEventListener('beforeunload', function() {
                if (animId) cancelAnimationFrame(animId);
            });
        })();

        // ============================================================
        //  2. 主题切换
        // ============================================================
        (function theme() {
            const btn = document.getElementById('themeToggle');
            const body = document.body;

            function getSaved() {
                try { return localStorage.getItem('app-theme-preference'); } catch (e) { return null; }
            }

            function save(t) {
                try { localStorage.setItem('app-theme-preference', t); } catch (e) {}
            }

            function apply(t) {
                body.classList.toggle('light-mode', t === 'light');
            }

            const saved = getSaved();
            if (saved === 'light') apply('light');
            else if (saved === 'dark') apply('dark');

            btn.addEventListener('click', function() {
                const isLight = body.classList.contains('light-mode');
                const next = isLight ? 'dark' : 'light';
                apply(next);
                save(next);
                btn.style.transform = 'scale(0.85)';
                setTimeout(() => { btn.style.transform = 'scale(1)'; }, 150);
            });
        })();

        // ============================================================
        //  3. 视频弹窗
        // ============================================================
        function openVideo() {
            const popup = document.getElementById('video-popup');
            const player = document.getElementById('player');

            player.play().catch(() => {});
        }

        function closeVideo() {
            const popup = document.getElementById('video-popup');
            const player = document.getElementById('player');
            popup.style.display = 'none';
            player.pause();
            player.currentTime = 0;
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (document.getElementById('video-popup').style.display === 'flex') closeVideo();
            }
        });

        // ============================================================
        //  4. Toast
        // ============================================================
        function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) return;
            clearTimeout(window._toastTimer);
            t.textContent = msg;
            t.classList.add('show');
            window._toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
        }

        // ============================================================
        //  5. 欢迎横幅
        // ============================================================
        function dismissWelcome() {
            const banner = document.getElementById('welcomeBanner');
            if (!banner) return;
            if (banner._autoHideTimer) clearTimeout(banner._autoHideTimer);
            banner.classList.remove('show');
        }

        function initWelcomeBanner() {
            const banner = document.getElementById('welcomeBanner');
            const el = document.getElementById('welcomeLocation');
            if (!banner || !el) return;

            el.textContent = '欢迎光临';

            fetch('https://api.vore.top/api/IPdata')
                .then(res => res.json())
                .then(data => {
                    if (data && data.ipdata && data.ipdata.info1) {
                        const info = data.ipdata;
                        const parts = [info.info1];
                        if (info.info2 && info.info2 !== info.info1) parts.push(info.info2);
                        if (info.info3 && info.info3 !== info.info2) parts.push(info.info3);
                        el.textContent = '来自 ' + parts.join(' ');
                    } else {
                        el.textContent = '欢迎光临';
                    }
                })
                .catch(() => { el.textContent = '欢迎光临'; })
                .finally(() => {
                    banner.classList.add('show');
                    banner._autoHideTimer = setTimeout(() => dismissWelcome(), 5000);
                });
        }

        // ============================================================
        //  6. 🔥 复制联系方式（从 1.html 移植）
        // ============================================================
        function copyContact(text, el) {
            if (!text) return;
            // 使用 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    flashCopy(el);
                    showToast('✅ 已复制: ' + text);
                }).catch(() => {
                    fallbackCopy(text, el);
                });
            } else {
                fallbackCopy(text, el);
            }
        }

        function fallbackCopy(text, el) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            ta.style.pointerEvents = 'none';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                flashCopy(el);
                showToast('✅ 已复制: ' + text);
            } catch (e) {
                // 静默失败
            }
            document.body.removeChild(ta);
        }

        function flashCopy(el) {
            if (!el) return;
            el.classList.remove('copied');
            // 强制回流触发动画
            void el.offsetWidth;
            el.classList.add('copied');
            setTimeout(() => {
                el.classList.remove('copied');
            }, 400);
        }

        // ============================================================
        //  7. 提示弹窗（倒计时）
        // ============================================================
        let noticeTimer = null;

        function initNoticePopup() {
            const overlay = document.getElementById('notice-popup');
            const btn = document.getElementById('noticeCloseBtn');
            const cd = document.getElementById('countdownDisplay');
            if (!overlay || !btn || !cd) return;

            try {
                if (sessionStorage.getItem('notice_popup_shown') === 'true') return;
            } catch (e) {}

            let count = 3;
            btn.disabled = true;
            cd.textContent = count;
            overlay.style.display = 'flex';

            if (noticeTimer) clearInterval(noticeTimer);
            noticeTimer = setInterval(function() {
                count -= 1;
                if (count <= 0) {
                    clearInterval(noticeTimer);
                    noticeTimer = null;
                    btn.disabled = false;
                    cd.textContent = '';
                    btn.innerHTML = '我知道了';
                    try { sessionStorage.setItem('notice_popup_shown', 'true'); } catch (e) {}
                } else {
                    cd.textContent = count;
                }
            }, 1000);

            btn.onclick = function() {
                if (btn.disabled) return;
                overlay.style.display = 'none';
                if (noticeTimer) { clearInterval(noticeTimer);
                    noticeTimer = null; }
            };
        }

        // ============================================================
        //  8. 启动
        // ============================================================
        window.addEventListener('DOMContentLoaded', function() {
            initWelcomeBanner();
            initNoticePopup();
        });
    </script>
