<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium App Store</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --accent-color: #0A84FF;
            --bg-gradient: linear-gradient(135deg, #e0e5ec 0%, #ffffff 100%);
        }

        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: -apple-system, "SF Pro Display", sans-serif;
            overflow-x: hidden;
            color: #fff;
        }

        .fluid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, #00416A, #E4E5E6, #007AFF);
            background-size: 400% 400%;
            animation: fluidMove 15s ease infinite;
            opacity: 0.6;
        }

        @keyframes fluidMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 60px 24px;
            box-sizing: border-box;
        }

        header h1 {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin: 0;
            background: linear-gradient(to bottom, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 17px;
            color: rgba(255,255,255,0.6);
            margin-top: 8px;
            margin-bottom: 40px;
        }

        /* --- 新增：教程按钮样式 --- */
        .video-btn-container {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 30px;
        }

        .tutorial-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tutorial-btn:active { transform: scale(0.92); }
        .btn-text { color: #fff; font-size: 14px; font-weight: 600; }

        /* --- 原有卡片样式 --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.4s cubic-bezier(0.15, 0.83, 0.66, 1);
            display: flex;
            flex-direction: column;
        }

        .app-icon { width: 72px; height: 72px; border-radius: 18px; margin-right: 20px; display: flex; justify-content: center; align-items: center; font-size: 36px; position: relative; overflow: hidden; }
        .plane-bg { background: linear-gradient(135deg, #2AABEE, #229ED9); }
        .vpn-bg { background: linear-gradient(135deg, #00D2FF, #3a7bd5); }
        .app-details h2 { margin: 0; font-size: 22px; font-weight: 700; }
        .app-details p { margin: 4px 0 0; font-size: 15px; color: rgba(255,255,255,0.5); }
        .blue-link { color: var(--ios-blue); font-size: 15px; font-weight: 600; text-decoration: none; margin-top: 18px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.08); display: block; text-align: center; }

        /* --- 新增：弹窗样式 --- */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: none; justify-content: center; align-items: center; z-index: 10000;
        }
        .popup-content { position: relative; width: 90%; max-width: 500px; background: #000; border-radius: 24px; overflow: hidden; }
        .close-btn { position: absolute; top: 10px; right: 15px; color: #fff; font-size: 28px; cursor: pointer; z-index: 10001; }
        video { width: 100%; display: block; }
    </style>
</head>
<body>

<div class="fluid-bg"></div>

<div class="container">
    <header>
        <h1>应用中心</h1>
        <p>Premium Collection</p>
    </header>

    <div class="video-btn-container">
        <div class="tutorial-btn" onclick="openVideo()">
            <span>🎬</span>
            <span class="btn-text">查看使用教程</span>
        </div>
    </div>

    <div class="glass-card" onclick="location.href='https://pan.xunlei.com/s/VOtNTceK05Lf0q_HEpwGBghZA1'">
        <div style="display: flex; align-items: center;">
            <div class="app-icon plane-bg">✈️</div>
            <div class="app-details">
                <h2>Telegram</h2>
                <p>极致安全的自由通讯</p>
            </div>
        </div>
        <div class="blue-link" onclick="event.stopPropagation(); window.location.href='https://new.818fka.com/shop/KKH011OA'">
            没有纸飞机账号怎么办？
        </div>
    </div>

    <div class="glass-card" onclick="location.href='https://9.lcvpn.sbs/?id=505291048'">
        <div style="display: flex; align-items: center;">
            <div class="app-icon vpn-bg">🍵</div>
            <div class="app-details">
                <h2>绿茶 VPN</h2>
                <p>跨越边界，丝滑连接</p>
            </div>
        </div>
    </div>
</div>

<div id="video-popup" class="popup-overlay" onclick="closeVideo()">
    <div class="popup-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeVideo()">×</span>
        <video id="player" controls>
            <source src="https://help.tgqqq.com/api.mp4" type="video/mp4">
        </video>
    </div>
</div>

<script>
    function openVideo() {
        document.getElementById('video-popup').style.display = 'flex';
        document.getElementById('player').play();
    }
    function closeVideo() {
        document.getElementById('video-popup').style.display = 'none';
        document.getElementById('player').pause();
    }
</script>

</body>
</html>
