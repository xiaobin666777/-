<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>xiaobing</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-orange: #FF9500;
            --ios-purple: #AF52DE;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(0, 0, 0, 0.06);
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --body-bg-start: #f5f5f7;
            --body-bg-end: #e8e8ed;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.04), inset 0 1px 0px rgba(255, 255, 255, 0.6);
            --separator-bg: rgba(0, 0, 0, 0.06);
            --badge-app-bg: rgba(0, 0, 0, 0.05);
            --badge-app-color: #555;
            --badge-app-border: rgba(0, 0, 0, 0.03);
            --shop-header-color: #28a745;
            --popup-bg: #fff;
            --popup-border: rgba(0, 0, 0, 0.05);
            --close-btn-bg: rgba(0, 0, 0, 0.05);
            --close-btn-color: #999;
            --header-title-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            --download-btn-bg: rgba(0, 122, 255, 0.1);
            --icon-shadow: 0 4px 12px rgba(0, 0, 0, 0.1), inset 0 0 1px rgba(0, 0, 0, 0.2);
            --btn-primary-card-bg: linear-gradient(135deg, rgba(52, 199, 89, 0.15) 0%, rgba(52, 199, 89, 0.05) 100%);
            --btn-primary-card-border: rgba(52, 199, 89, 0.3);
            --btn-secondary-card-bg: linear-gradient(135deg, rgba(0, 122, 255, 0.1) 0%, rgba(0, 122, 255, 0.03) 100%);
            --btn-secondary-card-border: rgba(0, 122, 255, 0.2);
            --overlay-bg: rgba(0, 0, 0, 0.4);
            --welcome-bg: rgba(255, 255, 255, 0.88);
            --welcome-border: rgba(0, 0, 0, 0.08);
            --welcome-text: #1d1d1f;
            --welcome-sub: #555;
            --notice-bg: #ffffff;
            --notice-border: rgba(0, 0, 0, 0.06);
            --notice-text: #1d1d1f;
            --notice-sub: #555;
            --notice-btn-bg: #007AFF;
            --notice-btn-text: #fff;
            --notice-btn-disabled-bg: rgba(0, 122, 255, 0.25);
            --notice-btn-disabled-text: rgba(255, 255, 255, 0.5);
            --notice-close-btn-color: #007AFF;
            --notice-ol-color: #007AFF;
            --shop-card-primary-bg: linear-gradient(135deg, rgba(52, 199, 89, 0.12) 0%, rgba(52, 199, 89, 0.03) 100%);
            --shop-card-primary-border: rgba(52, 199, 89, 0.25);
            --shop-card-primary-color: #28a745;
            --shop-card-secondary-bg: linear-gradient(135deg, rgba(0, 122, 255, 0.10) 0%, rgba(0, 122, 255, 0.03) 100%);
            --shop-card-secondary-border: rgba(0, 122, 255, 0.20);
            --shop-card-secondary-color: #007AFF;
        }

        body.dark-mode {
            --glass-bg: rgba(40, 40, 45, 0.78);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-sub: #98989d;
            --body-bg-start: #1c1c1e;
            --body-bg-end: #2c2c2e;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.25), inset 0 1px 0px rgba(255, 255, 255, 0.06);
            --separator-bg: rgba(255, 255, 255, 0.08);
            --badge-app-bg: rgba(255, 255, 255, 0.08);
            --badge-app-color: #c7c7cc;
            --badge-app-border: rgba(255, 255, 255, 0.06);
            --shop-header-color: #30d158;
            --popup-bg: #1c1c1e;
            --popup-border: rgba(255, 255, 255, 0.1);
            --close-btn-bg: rgba(255, 255, 255, 0.1);
            --close-btn-color: #c7c7cc;
            --header-title-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            --download-btn-bg: rgba(0, 122, 255, 0.2);
            --icon-shadow: 0 4px 12px rgba(0, 0, 0, 0.4), inset 0 0 1px rgba(255, 255, 255, 0.1);
            --btn-primary-card-bg: linear-gradient(135deg, rgba(52, 199, 89, 0.2) 0%, rgba(52, 199, 89, 0.08) 100%);
            --btn-primary-card-border: rgba(52, 199, 89, 0.35);
            --btn-secondary-card-bg: linear-gradient(135deg, rgba(0, 122, 255, 0.18) 0%, rgba(0, 122, 255, 0.06) 100%);
            --btn-secondary-card-border: rgba(0, 122, 255, 0.25);
            --overlay-bg: rgba(0, 0, 0, 0.7);
            --welcome-bg: rgba(30, 30, 35, 0.88);
            --welcome-border: rgba(255, 255, 255, 0.12);
            --welcome-text: #f5f5f7;
            --welcome-sub: #c7c7cc;
            --notice-bg: #1c1c1e;
            --notice-border: rgba(255, 255, 255, 0.1);
            --notice-text: #f5f5f7;
            --notice-sub: #c7c7cc;
            --notice-btn-bg: #0a84ff;
            --notice-btn-text: #fff;
            --notice-btn-disabled-bg: rgba(10, 132, 255, 0.2);
            --notice-btn-disabled-text: rgba(255, 255, 255, 0.4);
            --notice-close-btn-color: #0a84ff;
            --notice-ol-color: #0a84ff;
            --shop-card-primary-bg: linear-gradient(135deg, rgba(52, 199, 89, 0.20) 0%, rgba(52, 199, 89, 0.06) 100%);
            --shop-card-primary-border: rgba(52, 199, 89, 0.35);
            --shop-card-primary-color: #30d158;
            --shop-card-secondary-bg: linear-gradient(135deg, rgba(0, 122, 255, 0.18) 0%, rgba(0, 122, 255, 0.06) 100%);
            --shop-card-secondary-border: rgba(0, 122, 255, 0.25);
            --shop-card-secondary-color: #0a84ff;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, var(--body-bg-start) 0%, var(--body-bg-end) 100%);
            background-attachment: fixed;
            font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            overflow-x: hidden;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            transition: background 0.45s ease, color 0.45s ease;
        }

        .container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 50px 18px 30px;
            box-sizing: border-box;
        }

        .page-content {
            display: block;
            animation: fadeScale 0.35s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeScale {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(5px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        header {
            text-align: center;
            margin-bottom: 28px;
            position: relative;
        }
        header h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0;
            color: var(--text-main);
            text-shadow: var(--header-title-shadow);
            transition: color 0.45s ease, text-shadow 0.45s ease;
        }

        .theme-toggle {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.5px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: var(--card-shadow);
            z-index: 100;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .theme-toggle:active {
            transform: translateY(-50%) scale(0.88);
            transition: all 0.15s ease;
        }
        .theme-toggle .icon-moon,
        .theme-toggle .icon-sun {
            position: absolute;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            line-height: 1;
        }
        .theme-toggle .icon-moon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }
        .theme-toggle .icon-sun {
            opacity: 0;
            transform: rotate(90deg) scale(0.5);
        }
        body.dark-mode .theme-toggle .icon-moon {
            opacity: 0;
            transform: rotate(-90deg) scale(0.5);
        }
        body.dark-mode .theme-toggle .icon-sun {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }
        body.dark-mode .theme-toggle {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 200, 60, 0.15), 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .theme-toggle:hover {
            box-shadow: 0 0 22px rgba(255, 200, 60, 0.12), var(--card-shadow);
        }
        body.dark-mode .theme-toggle:hover {
            box-shadow: 0 0 28px rgba(255, 200, 60, 0.25), 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .welcome-banner {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 440px;
            z-index: 9998;
            background: var(--welcome-bg);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid var(--welcome-border);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.1), inset 0 1px 0px rgba(255, 255, 255, 0.5);
            transition: top 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.45s ease, border-color 0.45s ease;
            pointer-events: auto;
        }
        .welcome-banner.show {
            top: 16px;
        }
        .welcome-banner .welcome-text {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--welcome-text);
            transition: color 0.45s ease;
            flex: 1;
            min-width: 0;
        }
        .welcome-banner .welcome-text .emoji {
            font-size: 20px;
            flex-shrink: 0;
        }
        .welcome-banner .welcome-text .location {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .welcome-banner .welcome-close {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.06);
            color: var(--welcome-sub);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            line-height: 1;
        }
        .welcome-banner .welcome-close:active {
            background: rgba(0, 0, 0, 0.15);
            transform: scale(0.9);
        }
        body.dark-mode .welcome-banner .welcome-close {
            background: rgba(255, 255, 255, 0.1);
            color: #c7c7cc;
        }
        body.dark-mode .welcome-banner .welcome-close:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .liquid-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            transition: background 0.45s ease, border-color 0.45s ease, box-shadow 0.45s ease;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 6px;
            transition: background 0.45s ease, color 0.45s ease, border-color 0.45s ease;
        }
        .badge-tutorial {
            background: rgba(255, 149, 0, 0.12);
            color: #e07b00;
            border: 1px solid rgba(255, 149, 0, 0.15);
        }
        .badge-app {
            background: var(--badge-app-bg);
            color: var(--badge-app-color);
            border: 1px solid var(--badge-app-border);
        }

        .tutorial-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tutorial-info h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            transition: color 0.45s ease;
        }
        .tutorial-info p {
            margin: 4px 0 0;
            font-size: 12px;
            color: var(--text-sub);
            transition: color 0.45s ease;
        }
        .tutorial-btn {
            background: var(--ios-blue);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .tutorial-btn:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        .shop-section-title {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
            color: var(--text-main);
            transition: color 0.45s ease;
            letter-spacing: -0.3px;
        }
        .shop-section-title .emoji {
            font-size: 22px;
        }
        .shop-grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .shop-card-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 12px;
            border-radius: 18px;
            text-decoration: none;
            text-align: center;
            transition: all 0.25s ease;
            border: 1px solid transparent;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            min-height: 100px;
        }
        .shop-card-link:active {
            transform: scale(0.96);
        }
        .shop-card-link .card-icon {
            font-size: 30px;
            margin-bottom: 6px;
        }
        .shop-card-link .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2px;
            transition: color 0.45s ease;
        }
        .shop-card-link .card-desc {
            font-size: 12px;
            opacity: 0.75;
            transition: color 0.45s ease;
        }

        .shop-card-primary {
            background: var(--shop-card-primary-bg);
            border-color: var(--shop-card-primary-border);
            color: var(--shop-card-primary-color);
        }
        .shop-card-primary .card-title {
            color: var(--shop-card-primary-color);
        }
        .shop-card-primary:active {
            background: rgba(52, 199, 89, 0.20);
        }
        body.dark-mode .shop-card-primary:active {
            background: rgba(52, 199, 89, 0.28);
        }

        .shop-card-secondary {
            background: var(--shop-card-secondary-bg);
            border-color: var(--shop-card-secondary-border);
            color: var(--shop-card-secondary-color);
        }
        .shop-card-secondary .card-title {
            color: var(--shop-card-secondary-color);
        }
        .shop-card-secondary:active {
            background: rgba(0, 122, 255, 0.18);
        }
        body.dark-mode .shop-card-secondary:active {
            background: rgba(0, 122, 255, 0.25);
        }

        .app-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 0;
        }
        .app-separator {
            height: 1px;
            background: var(--separator-bg);
            margin: 16px 0;
            transition: background 0.45s ease;
        }
        .app-meta {
            display: flex;
            align-items: center;
        }
        .app-icon-img {
            width: 62px;
            height: 62px;
            border-radius: 14px;
            margin-right: 14px;
            object-fit: cover;
            box-shadow: var(--icon-shadow);
            transition: box-shadow 0.45s ease;
        }
        .app-details h2 {
            margin: 0;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-main);
            transition: color 0.45s ease;
        }
        .app-details p {
            margin: 4px 0 0;
            font-size: 12px;
            color: var(--text-sub);
            transition: color 0.45s ease;
        }
        .download-btn {
            background: var(--download-btn-bg);
            color: var(--ios-blue);
            border: 1px solid rgba(0, 122, 255, 0.05);
            padding: 7px 18px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .download-btn:active {
            transform: scale(0.94);
            background: var(--ios-blue);
            color: #fff;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
            transition: background 0.45s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .popup-content {
            position: relative;
            width: 88%;
            max-width: 360px;
            background: var(--popup-bg);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--popup-border);
            transform: scale(0.9);
            animation: popUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transition: background 0.45s ease, border-color 0.45s ease;
        }
        @keyframes popUp {
            to {
                transform: scale(1);
            }
        }
        .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            color: var(--close-btn-color);
            font-size: 22px;
            cursor: pointer;
            z-index: 10001;
            width: 28px;
            height: 28px;
            background: var(--close-btn-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.45s ease;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }

        #notice-popup .popup-content {
            max-width: 400px;
            padding: 0;
            overflow: visible;
        }
        .notice-inner {
            padding: 28px 24px 24px;
        }
        .notice-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .notice-header .notice-icon {
            font-size: 28px;
            flex-shrink: 0;
        }
        .notice-header .notice-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--notice-text);
            letter-spacing: -0.3px;
            transition: color 0.45s ease;
        }
        .notice-body {
            color: var(--notice-text);
            transition: color 0.45s ease;
        }
        .notice-body ol {
            margin: 0 0 12px 0;
            padding-left: 22px;
            font-size: 14px;
            line-height: 1.7;
            font-weight: 500;
            color: var(--notice-text);
            transition: color 0.45s ease;
        }
        .notice-body ol li {
            margin-bottom: 4px;
        }
        .notice-body ol li::marker {
            color: var(--notice-ol-color);
            font-weight: 700;
            transition: color 0.45s ease;
        }
        .notice-extra {
            font-size: 13px;
            font-weight: 600;
            color: var(--notice-sub);
            margin: 8px 0 12px 0;
            padding: 10px 14px;
            background: rgba(255, 149, 0, 0.08);
            border-radius: 10px;
            border-left: 3px solid #ff9500;
            transition: color 0.45s ease, background 0.45s ease;
        }
        .notice-contact {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--notice-text);
            background: rgba(0, 122, 255, 0.08);
            padding: 10px 14px;
            border-radius: 10px;
            margin-top: 4px;
            transition: color 0.45s ease, background 0.45s ease;
        }
        .notice-contact span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .notice-contact .contact-tag {
            font-weight: 400;
            color: var(--notice-sub);
            transition: color 0.45s ease;
        }
        .notice-contact .contact-value {
            font-weight: 700;
            color: var(--notice-text);
            transition: color 0.45s ease;
        }
        .notice-footer {
            margin-top: 22px;
            display: flex;
            justify-content: flex-end;
        }
        .notice-close-btn {
            padding: 12px 32px;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            background: var(--notice-btn-bg);
            color: var(--notice-btn-text);
            box-shadow: 0 4px 16px rgba(0, 122, 255, 0.25);
            width: 100%;
            text-align: center;
            letter-spacing: 0.3px;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            transition: background 0.45s ease, color 0.45s ease, opacity 0.25s ease, transform 0.15s ease;
        }
        .notice-close-btn:disabled {
            background: var(--notice-btn-disabled-bg);
            color: var(--notice-btn-disabled-text);
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.8;
        }
        .notice-close-btn:not(:disabled):active {
            transform: scale(0.95);
            opacity: 0.85;
        }
        .notice-close-btn .countdown-badge {
            display: inline-block;
            min-width: 22px;
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 0 6px;
            margin: 0 4px;
            font-variant-numeric: tabular-nums;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            z-index: 99999;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        body.dark-mode .toast {
            background: rgba(255, 255, 255, 0.9);

    <script>
        (function() {
            const themeToggleBtn = document.getElementById('themeToggle');
            const body = document.body;

            function getSavedTheme() {
                try { return localStorage.getItem('app-theme-preference'); } catch (e) { return null; }
            }

            function saveThemePreference(theme) {
                try { localStorage.setItem('app-theme-preference', theme); } catch (e) {}
            }

            function applyTheme(theme) {
                if (theme === 'dark') body.classList.add('dark-mode');
                else body.classList.remove('dark-mode');
            }

            const savedTheme = getSavedTheme();
            if (savedTheme === 'dark') applyTheme('dark');
            else if (savedTheme === 'light') applyTheme('light');

            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', function() {
                    const isDark = body.classList.contains('dark-mode');
                    applyTheme(isDark ? 'light' : 'dark');
                    saveThemePreference(isDark ? 'light' : 'dark');
                    themeToggleBtn.style.transform = 'translateY(-50%) scale(0.85)';
                    setTimeout(() => { themeToggleBtn.style.transform = 'translateY(-50%) scale(1)'; }, 150);
                });
            }
        })();

        function openVideo() {
            document.getElementById('video-popup').style.display = 'flex';
            document.getElementById('player').play();
        }

        function closeVideo() {
            document.getElementById('video-popup').style.display = 'none';
            const v = document.getElementById('player');
            v.pause();
            v.currentTime = 0;
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && document.getElementById('video-popup').style.display === 'flex') closeVideo();
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            clearTimeout(window.toastTimer);
            toast.textContent = msg;
            toast.classList.add('show');
            window.toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
        }

        function dismissWelcome() {
            const banner = document.getElementById('welcomeBanner');
            if (!banner) return;
            if (banner._autoHideTimer) clearTimeout(banner._autoHideTimer);
            banner.classList.remove('show');
        }

        function initWelcomeBanner() {
            const banner = document.getElementById('welcomeBanner');
            const locationEl = document.getElementById('welcomeLocation');
            if (!banner || !locationEl) return;

            locationEl.textContent = '欢迎光临';

            fetch('https://api.vore.top/api/IPdata')
                .then(res => res.json())
                .then(data => {
                    if (data && data.ipdata && data.ipdata.info1) {
                        const info = data.ipdata;
                        const parts = [info.info1];
                        if (info.info2 && info.info2 !== info.info1) parts.push(info.info2);
                        if (info.info3 && info.info3 !== info.info2) parts.push(info.info3);
                        locationEl.textContent = '来自 ' + parts.join(' ');
                    } else {
                        locationEl.textContent = '欢迎光临';
                    }
                })
                .catch(() => {
                    locationEl.textContent = '欢迎光临';
                })
                .finally(() => {
                    banner.classList.add('show');
                    banner._autoHideTimer = setTimeout(() => dismissWelcome(), 5000);
                });
        }

        let noticeCountdownTimer = null;

        function initNoticePopup() {
            const overlay = document.getElementById('notice-popup');
            const closeBtn = document.getElementById('noticeCloseBtn');
            const countdownEl = document.getElementById('countdownDisplay');

            if (!overlay || !closeBtn || !countdownEl) return;

            try {
                if (sessionStorage.getItem('notice_popup_shown') === 'true') {
                    return;
                }
            } catch (e) { /* ignore */ }

            let countdown = 3;
            closeBtn.disabled = true;
            countdownEl.textContent = countdown;
            overlay.style.display = 'flex';

            if (noticeCountdownTimer) clearInterval(noticeCountdownTimer);
            noticeCountdownTimer = setInterval(function() {
                countdown -= 1;
                if (countdown <= 0) {
                    clearInterval(noticeCountdownTimer);
                    noticeCountdownTimer = null;
                    closeBtn.disabled = false;
                    countdownEl.textContent = '';
                    closeBtn.innerHTML = '我知道了';
                    try {
                        sessionStorage.setItem('notice_popup_shown', 'true');
                    } catch (e) { /* ignore */ }
                } else {
                    countdownEl.textContent = countdown;
                }
            }, 1000);

            closeBtn.onclick = function() {
                if (closeBtn.disabled) return;
                overlay.style.display = 'none';
                if (noticeCountdownTimer) {
                    clearInterval(noticeCountdownTimer);
                    noticeCountdownTimer = null;
                }
            };
        }

        window.addEventListener('DOMContentLoaded', function() {
            initWelcomeBanner();
            initNoticePopup();
        });
    </script>
