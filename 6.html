<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium App Store</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --accent-color: #0A84FF;
            --bg-gradient: linear-gradient(135deg, #e0e5ec 0%, #ffffff 100%);
        }

        body {
            margin: 0;
            padding: 0;
            background: #000; /* 背景黑底，配合流体动画 */
            font-family: -apple-system, "SF Pro Display", sans-serif;
            overflow-x: hidden;
            color: #fff;
        }

        /* 动态彩色流体背景 - 保持原样 */
        .fluid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, #00416A, #E4E5E6, #007AFF);
            background-size: 400% 400%;
            animation: fluidMove 15s ease infinite;
            opacity: 0.6;
        }

        @keyframes fluidMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 60px 24px;
            box-sizing: border-box;
        }

        header h1 {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin: 0;
            background: linear-gradient(to bottom, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 17px;
            color: rgba(255,255,255,0.6);
            margin-top: 8px;
            margin-bottom: 40px;
        }

        /* 高级毛玻璃卡片 - 保持原样 */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transition: all 0.4s cubic-bezier(0.15, 0.83, 0.66, 1);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .glass-card:active {
            transform: scale(0.95);
        }

        .card-main {
            display: flex;
            align-items: center;
        }

        .app-icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            margin-right: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            position: relative;
            overflow: hidden;
        }

        .app-icon::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 100%);
        }

        .plane-bg { background: linear-gradient(135deg, #2AABEE, #229ED9); }
        .vpn-bg { background: linear-gradient(135deg, #00D2FF, #3a7bd5); }

        .app-details h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        .app-details p {
            margin: 4px 0 0;
            font-size: 15px;
            color: rgba(255,255,255,0.5);
        }

        /* 蓝色字体链接 - 保持原样 */
        .blue-link {
            color: var(--ios-blue);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.08);
            display: block;
            text-align: center;
            transition: color 0.3s;
        }

        .blue-link:hover { color: #5AC8FA; }

        /* --- 优化后的跳转遮罩层 UI --- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .countdown-text {
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #fff;
        }

        #num { color: var(--ios-blue); font-weight: 800; font-size: 24px; }

        /* 进度条容器 */
        .progress-container {
            width: 70%;
            max-width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        /* 进度条进度 */
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--ios-blue), #5AC8FA);
            box-shadow: 0 0 15px rgba(0, 122, 255, 0.5);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

<div class="fluid-bg"></div>

<div class="container">
    <header>
        <h1>应用中心</h1>
        <p>Premium Collection</p>
    </header>

    <div class="glass-card" onclick="location.href='https://pan.xunlei.com/s/VOtNTceK05Lf0q_HEpwGBghZA1'">
        <div class="card-main">
            <div class="app-icon plane-bg">✈️</div>
            <div class="app-details">
                <h2>Telegram</h2>
                <p>极致安全的自由通讯</p>
            </div>
        </div>
        <div class="blue-link" onclick="startTimer(event, 'https://new.818fka.com/shop/KKH011OA')">
            没有纸飞机账号怎么办？
        </div>
    </div>

    <div class="glass-card" onclick="location.href='https://9.lcvpn.sbs/?id=505291048'">
        <div class="card-main">
            <div class="app-icon vpn-bg">🍵</div>
            <div class="app-details">
                <h2>绿茶 VPN</h2>
                <p>跨越边界，丝滑连接</p>
            </div>
        </div>
    </div>
</div>

<div id="loading-screen">
    <div class="countdown-text">正在尝试建立安全连接 <span id="num">3</span>s</div>
    <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>
</div>

<script>
    function startTimer(e, url) {
        e.stopPropagation(); // 防止点到背景卡片
        const screen = document.getElementById('loading-screen');
        const num = document.getElementById('num');
        const bar = document.getElementById('progress-bar');
        
        screen.style.display = 'flex';
        
        let timeLeft = 3;
        let progress = 0;
        
        // 倒计时数字（每秒减1）
        const timer = setInterval(() => {
            timeLeft--;
            num.innerText = timeLeft;
            if(timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = url;
            }
        }, 1000);

        // 丝滑进度条（每100毫秒更新一次）
        const progressInterval = setInterval(() => {
            progress += 3.33; // 3秒约等于 30次 * 3.33%
            bar.style.width = progress + '%';
            if (progress >= 100) {
                clearInterval(progressInterval);
            }
        }, 100);
    }
</script>

</body>
</html>
